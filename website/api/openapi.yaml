openapi: 3.1.0

info:
  title: go2nvr
  version: 0.4.0
  license: { name: MIT,url: https://opensource.org/licenses/MIT }
  contact: { url: https://github.com/AlexxIT/go2rtc }
  description: |
    Ultimate camera streaming application with support RTSP, RTMP, HTTP-FLV, WebRTC, MSE, HLS, MP4, MJPEG, HomeKit, FFmpeg, etc.

servers:
  - url: http://localhost:1984

tags:
  - name: Application
    description: "[Module: API](https://github.com/AlexxIT/go2rtc#module-api)"
  - name: Config
    description: "[Configuration](https://github.com/AlexxIT/go2rtc#configuration)"
  - name: Streams list
    description: "[Module: Streams](https://github.com/AlexxIT/go2rtc#module-streams)"
  - name: Consume stream
  - name: HLS
  - name: Snapshot
  - name: Produce stream
  - name: WebSocket
    description: "WebSocket API endpoint: `/api/ws` (see `api/README.md`)"
  - name: Discovery
  - name: HomeKit
  - name: ONVIF
  - name: RTSPtoWebRTC
  - name: WebTorrent
    description: "[Module: WebTorrent](https://github.com/AlexxIT/go2rtc#module-webtorrent)"
  - name: FFmpeg
  - name: Record
  - name: Debug

components:
  parameters:
    stream_src_path:
      name: src
      in: path
      description: Source stream name
      required: true
      schema: { type: string }
      example: camera1

    stream_dst_path:
      name: dst
      in: path
      description: Destination stream name
      required: true
      schema: { type: string }
      example: camera1

    stream_src_query:
      name: src
      in: query
      description: Source stream name
      required: true
      schema: { type: string }
      example: camera1

    hls_session_id_path:
      name: id
      in: path
      description: HLS session ID (passed as query param `id`)
      required: true
      schema: { type: string }
      example: DvmHdd9w

    mp4_filter:
      name: mp4
      in: query
      description: MP4 codecs filter
      required: false
      schema:
        type: string
        enum: [ "", flac, all ]
      example: flac

    video_filter:
      name: video
      in: query
      description: Video codecs filter
      schema:
        type: string
        enum: [ "", all, h264, h265, mjpeg ]
      example: h264,h265

    audio_filter:
      name: audio
      in: query
      description: Audio codecs filter
      schema:
        type: string
        enum: [ "", all, aac, opus, pcm, pcmu, pcma ]
      example: aac

  responses:
    discovery:
      description: ""
      content:
        application/json:
          example: { streams: [ { "name": "Camera 1","url": "..." } ] }

    webtorrent:
      description: ""
      content:
        application/json:
          example: { share: AKDypPy4zz, pwd: H0Km1HLTTP }

  schemas:
    RecordState:
      type: object
      required: [ name, status, phase, desired_recording, storage_id ]
      properties:
        name: { type: string, example: camera1 }
        status: { type: string, enum: [ stopped, idle, recording ] }
        phase: { type: string, enum: [ stopped, unavailable, attaching, draining, idle, recording, backoff ] }
        desired_recording: { type: boolean }
        file: { type: string, example: streams/4f3f.../2026-07-19/1784462400000000000.mp4 }
        duration: { type: string, example: 43s }
        prebuffer: { type: integer, minimum: 0 }
        trigger_id: { type: integer }
        last_error: { type: string }
        retry_at: { type: string, format: date-time }
        stop_reason: { type: string, example: backpressure }
        storage_id: { type: string, description: SHA-256 of the normalized stream source }
    RecordFileItem:
      type: object
      required: [ name, path, is_file ]
      properties:
        name: { type: string, example: camera1 }
        path: { type: string, example: streams/4f3f.../2026-07-19/1784462400000000000.mp4 }
        is_file: { type: boolean }
        size: { type: integer, format: int64 }
        mod_time: { type: integer, format: int64 }
    RecordRule:
      type: object
      required: [ src ]
      properties:
        src: { type: string, example: camera1 }
        prebuffer: { type: integer, minimum: 0 }
        trigger_id: { type: integer }
        trigger_interval: { type: integer, minimum: 1 }
        trigger_params: { type: object, additionalProperties: true }

paths:
  /api:
    get:
      summary: Get application info
      tags: [ Application ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_path: { type: string, example: "/config/go2rtc.yaml" }
                  host: { type: string, example: "192.168.1.123:1984" }
                  rtsp:
                    type: object
                    properties:
                      listen: { type: string, example: ":8554" }
                      default_query: { type: string, example: "video&audio" }
                  version: { type: string, example: "1.9.12" }

  /api/exit:
    post:
      summary: Close application
      tags: [ Application ]
      parameters:
        - name: code
          in: query
          description: Application exit code
          required: false
          schema: { type: integer }
          example: 100
      responses:
        default:
          description: ""

  /api/restart:
    post:
      summary: Restart daemon
      description: Restarts the daemon.
      tags: [ Application ]
      responses:
        default:
          description: ""

  /api/log:
    get:
      summary: Get in-memory logs buffer
      description: |
        Returns current log output from the in-memory circular buffer.
      tags: [ Application ]
      responses:
        "200":
          description: OK
          content:
            application/jsonlines:
              example: |
                {"level":"info","version":"0.4.0","platform":"linux/amd64","revision":"dfe4755","time":1766841087331,"message":"go2nvr"}
    delete:
      summary: Clear in-memory logs buffer
      tags: [ Application ]
      responses:
        "200":
          description: ""
          content:
            text/plain: { example: "" }

  /api/config:
    get:
      summary: Get main config file content
      tags: [ Config ]
      responses:
        "200":
          description: ""
          content:
            application/yaml: { example: "streams:..." }
        "404":
          description: Config file not found
    post:
      summary: Rewrite main config file
      tags: [ Config ]
      requestBody:
        content:
          "*/*": { example: "streams:..." }
      responses:
        default:
          description: ""
    patch:
      summary: Merge changes to main config file
      tags: [ Config ]
      requestBody:
        content:
          "*/*": { example: "streams:..." }
      responses:
        default:
          description: ""



  /api/streams:
    get:
      summary: Get all streams info
      tags: [ Streams list ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    producers:
                      type: array
                    consumers:
                      type: array
    put:
      summary: Create new stream
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream source (URI)
          required: true
          schema: { type: string }
          example: "rtsp://rtsp:12345678@192.168.1.123/av_stream/ch0"
        - name: name
          in: query
          description: Stream name
          required: false
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    patch:
      summary: Update stream source
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream source (URI)
          required: true
          schema: { type: string }
          example: "rtsp://rtsp:12345678@192.168.1.123/av_stream/ch0"
        - name: name
          in: query
          description: Stream name
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    delete:
      summary: Delete stream
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream name
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    post:
      summary: Send stream from source to destination
      description: "[Stream to camera](https://github.com/AlexxIT/go2rtc#stream-to-camera)"
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream source (URI)
          required: true
          schema: { type: string }
          example: "ffmpeg:http://example.com/song.mp3#audio=pcma#input=file"
        - name: dst
          in: query
          description: Destination stream name
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""

  /api/streams.dot:
    get:
      summary: Get streams graph in Graphviz DOT format
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream name filter. Repeat `src` to include multiple streams.
          required: false
          schema: { type: string }
          example: camera1
      responses:
        "200":
          description: OK
          content:
            text/vnd.graphviz:
              example: "digraph { ... }"

  /api/preload:
    get:
      summary: Get all preloaded streams
      tags: [ Streams list ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    consumer:
                      type: object
                    query:
                      type: string
                      example: "video&audio"
    put:
      summary: Preload new stream
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream source (name)
          required: true
          schema: { type: string }
          example: "camera1"
        - name: video
          in: query
          description: Video codecs filter
          required: false
          schema: { type: string }
          example: all,h264,h265,...
        - name: audio
          in: query
          description: Audio codecs filter
          required: false
          schema: { type: string }
          example: all,aac,opus,...
        - name: microphone
          in: query
          description: Microphone codecs filter
          required: false
          schema: { type: string }
          example: all,aac,opus,...
      responses:
        default:
          description: ""
    delete:
      summary: Delete preloaded stream
      tags: [ Streams list ]
      parameters:
        - name: src
          in: query
          description: Stream source (name)
          required: true
          schema: { type: string }
          example: "camera1"
      responses:
        default:
          description: ""

  /api/schemes:
    get:
      summary: Get supported source URL schemes
      tags: [ Streams list ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: [ rtsp, rtmp, webrtc, ffmpeg, hass ]


  /api/streams?src={src}:
    get:
      summary: Get stream info in JSON format
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    producers:
                      type: array
                      items: { type: object }
                    consumers:
                      type: array
                      items: { type: object }

  /api/webrtc?src={src}:
    post:
      summary: Get stream in WebRTC format (WHEP)
      description: "[Module: WebRTC](https://github.com/AlexxIT/go2rtc#module-webrtc)"
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      requestBody:
        description: |
          Support:
          - JSON format (`Content-Type: application/json`)
          - WHEP standard (`Content-Type: application/sdp`)
          - raw SDP (`Content-Type: anything`)
        required: true
        content:
          application/json: { example: { type: offer, sdp: "v=0..." } }
          "application/sdp": { example: "v=0..." }
          "*/*": { example: "v=0..." }
      responses:
        "200":
          description: "Response on JSON or raw SDP"
          content:
            application/json: { example: { type: answer, sdp: "v=0..." } }
            application/sdp: { example: "v=0..." }
        "201":
          description: "Response on `Content-Type: application/sdp`"
          content:
            application/sdp: { example: "v=0..." }

  /api/stream.mp4?src={src}:
    get:
      summary: Get stream in MP4 format (HTTP progressive)
      description: "[Module: MP4](https://github.com/AlexxIT/go2rtc#module-mp4)"
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: duration
          in: query
          description: Limit the length of the stream in seconds
          required: false
          schema: { type: string }
          example: 15
        - name: filename
          in: query
          description: Download as a file with this name
          required: false
          schema: { type: string }
          example: camera1.mp4
        - name: rotate
          in: query
          description: "Rotate video (degrees). Supported values: 90, 180, 270."
          required: false
          schema: { type: integer, enum: [ 90, 180, 270 ] }
        - name: scale
          in: query
          description: Scale video in format `width:height`
          required: false
          schema: { type: string, example: "1280:720" }
        - $ref: "#/components/parameters/mp4_filter"
        - $ref: "#/components/parameters/video_filter"
        - $ref: "#/components/parameters/audio_filter"
      responses:
        200:
          description: ""
          content: { video/mp4: { example: "" } }

  /api/stream.m3u8?src={src}:
    get:
      summary: Get stream in HLS format
      description: "[Module: HLS](https://github.com/AlexxIT/go2rtc#module-hls)"
      tags: [ Consume stream, HLS ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - $ref: "#/components/parameters/mp4_filter"
        - $ref: "#/components/parameters/video_filter"
        - $ref: "#/components/parameters/audio_filter"
      responses:
        200:
          description: ""
          content: { application/vnd.apple.mpegurl: { example: "" } }

  /api/hls/playlist.m3u8?id={id}:
    get:
      summary: Get HLS media playlist for an active session
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: OK
          content:
            application/vnd.apple.mpegurl: { example: "" }
        "404":
          description: Session not found

  /api/hls/segment.ts?id={id}:
    get:
      summary: Get HLS MPEG-TS segment for an active session
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: OK
          content:
            video/mp2t: { example: "" }
        "404":
          description: Segment or session not found

  /api/hls/init.mp4?id={id}:
    get:
      summary: Get HLS fMP4 init segment for an active session
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: OK
          content:
            video/mp4: { example: "" }
        "404":
          description: Segment or session not found

  /api/hls/segment.m4s?id={id}:
    get:
      summary: Get HLS fMP4 media segment for an active session
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: OK
          content:
            video/iso.segment: { example: "" }
        "404":
          description: Segment or session not found

  /api/stream.mjpeg?src={src}:
    get:
      summary: Get stream in MJPEG format
      description: "[Module: MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        200:
          description: ""
          content: { multipart/x-mixed-replace: { example: "" } }

  /api/stream.ascii?src={src}:
    get:
      summary: Get stream in ASCII-art format (ANSI escape codes)
      description: "[Module: MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: color
          in: query
          description: Foreground mode (`8`, `256`, `rgb` or ANSI SGR code)
          required: false
          schema: { type: string }
        - name: back
          in: query
          description: Background mode (`8`, `256`, `rgb` or ANSI SGR code)
          required: false
          schema: { type: string }
        - name: text
          in: query
          description: Charset preset (empty/default, `block`) or custom characters
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            text/plain: { example: "" }
        "404":
          description: Stream not found

  /api/stream.y4m?src={src}:
    get:
      summary: Get stream in YUV4MPEG2 format (y4m)
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream: { example: "" }
        "404":
          description: Stream not found

  /api/stream.ts?src={src}:
    get:
      summary: Get stream in MPEG-TS format
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: OK
          content:
            video/mp2t: { example: "" }
        "404":
          description: Stream not found

  /api/stream.aac?src={src}:
    get:
      summary: Get stream audio in AAC (ADTS) format
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: OK
          content:
            audio/aac: { example: "" }
        "404":
          description: Stream not found

  /api/stream.flv?src={src}:
    get:
      summary: Get stream in FLV format
      tags: [ Consume stream ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: OK
          content:
            video/x-flv: { example: "" }
        "404":
          description: Stream not found

  /api/frame.jpeg?src={src}:
    get:
      summary: Get snapshot in JPEG format
      description: "[Module: MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ Snapshot ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: name
          in: query
          description: Optional stream name to create/update if `src` is a URL
          required: false
          schema: { type: string }
        - name: width
          in: query
          description: "Scale output width (alias: `w`)"
          required: false
          schema: { type: integer, minimum: 1 }
        - name: height
          in: query
          description: "Scale output height (alias: `h`)"
          required: false
          schema: { type: integer, minimum: 1 }
        - name: rotate
          in: query
          description: "Rotate output (degrees). Supported values: 90, 180, 270."
          required: false
          schema: { type: integer, enum: [ 90, 180, 270 ] }
        - name: hardware
          in: query
          description: "Hardware acceleration engine for FFmpeg snapshot transcoding (alias: `hw`)"
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ""
          content:
            image/jpeg: { example: "" }

  /api/frame.mp4?src={src}:
    get:
      summary: Get snapshot in MP4 format
      description: "[Module: MP4](https://github.com/AlexxIT/go2rtc#module-mp4)"
      tags: [ Snapshot ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: filename
          in: query
          description: Download as a file with this name
          required: false
          schema: { type: string }
          example: camera1.mp4
      responses:
        200:
          description: ""
          content:
            video/mp4: { example: "" }



  /api/webrtc?dst={dst}:
    post:
      summary: Post stream in WebRTC format (WHIP)
      description: "[Incoming: WebRTC/WHIP](https://github.com/AlexxIT/go2rtc#incoming-webrtcwhip)"
      tags: [ Produce stream ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Resource URL for session
              schema: { type: string }
          content:
            application/sdp: { example: "v=0..." }
        "404":
          description: Stream not found

  /api/stream?dst={dst}:
    post:
      summary: Post stream in auto-detected format
      description: |
        Incoming source with automatic format detection. Use for pushing a stream into an existing `dst` stream.
      tags: [ Produce stream ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.flv?dst={dst}:
    post:
      summary: Post stream in FLV format
      description: "[Incoming sources](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ Produce stream ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.ts?dst={dst}:
    post:
      summary: Post stream in MPEG-TS format
      description: "[Incoming sources](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ Produce stream ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.mjpeg?dst={dst}:
    post:
      summary: Post stream in MJPEG format
      description: "[Incoming sources](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ Produce stream ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""


  /api/record:
    get:
      summary: Get recording states or list new-layout recordings
      tags: [ Record ]
      parameters:
        - name: src
          in: query
          required: false
          schema: { type: string }
        - name: path
          in: query
          required: false
          description: Constrained logical path. `.` lists stream sources.
          schema: { type: string, example: streams/4f3f.../2026-07-19 }
      responses:
        "200":
          description: Recording state or file items
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RecordState"
                  - type: array
                    items: { $ref: "#/components/schemas/RecordState" }
                  - type: array
                    items: { $ref: "#/components/schemas/RecordFileItem" }
        "403": { description: Invalid or unsafe logical path }
        "404": { description: Stream not found }
    post:
      summary: Start or stop a recording
      tags: [ Record ]
      parameters:
        - name: src
          in: query
          required: true
          schema: { type: string }
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [ start, stop ] }
      responses:
        "200":
          description: Requested operation completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordState" }
        "202":
          description: Recorder is attaching, draining, or backing off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordState" }
        "404": { description: Stream not found }
        "503": { description: Recorder unavailable }

  /api/record/file:
    get:
      summary: Stream a recording or thumbnail from the new layout
      tags: [ Record ]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, example: streams/4f3f.../2026-07-19/1784462400000000000.mp4 }
        - name: download
          in: query
          required: false
          schema: { type: string, enum: [ "1" ] }
      responses:
        "200": { description: Recording content }
        "403": { description: Invalid, legacy, or unsafe path }
        "404": { description: Recording not found }
    delete:
      summary: Delete a recording or thumbnail
      tags: [ Record ]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { description: Invalid, legacy, or unsafe path }
        "404": { description: Recording not found }

  /api/record/rules:
    get:
      summary: Get recording rules
      tags: [ Record ]
      parameters:
        - name: src
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Rule or rules
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RecordRule"
                  - type: array
                    items: { $ref: "#/components/schemas/RecordRule" }
        "404": { description: Rule not found }
    post:
      summary: Create or update a recording rule
      tags: [ Record ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordRule" }
      responses:
        "200": { description: Rule persisted }
    delete:
      summary: Delete a recording rule
      tags: [ Record ]
      parameters:
        - name: src
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rule deleted }

  /api/record/triggers:
    get:
      summary: List recording trigger detectors
      tags: [ Record ]
      responses:
        "200": { description: Trigger metadata }

  /api/record/config:
    get:
      summary: Get UI-managed recording configuration
      tags: [ Record ]
      responses:
        "200":
          description: Directory and retention only; limits remain YAML-only
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: { type: string }
                  retention: { type: integer, minimum: 1 }
    post:
      summary: Update UI-managed recording configuration
      tags: [ Record ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dir: { type: string }
                retention: { type: integer, minimum: 1 }
      responses:
        "200": { description: Configuration persisted }

  /api/ffmpeg:
    post:
      summary: Play file/live/TTS into a stream via FFmpeg
      description: |
        Helper endpoint for "stream to camera" scenarios.
        Exactly one of `file`, `live`, `text` should be provided.
      tags: [ FFmpeg ]
      parameters:
        - name: dst
          in: query
          description: Destination stream name
          required: true
          schema: { type: string }
          example: camera1
        - name: file
          in: query
          description: Input URL to treat as file (`#input=file`)
          required: false
          schema: { type: string }
          example: "http://example.com/song.mp3"
        - name: live
          in: query
          description: Live input URL
          required: false
          schema: { type: string }
          example: "http://example.com/live.mp3"
        - name: text
          in: query
          description: Text-to-speech phrase
          required: false
          schema: { type: string }
          example: "Hello"
        - name: voice
          in: query
          description: Optional TTS voice (engine-dependent)
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
        "400":
          description: Invalid parameters
        "404":
          description: Stream not found

  /api/ttspush/push:
    post:
      summary: Synthesize and push audio in-memory
      description: |
        Streaming-only endpoint with no local file write.
        Supports `ipwebcam`/`wss` and `backchannel`/`stream` targets.
        Parameters can be provided via query string or JSON body (query overrides body).
      tags: [ FFmpeg ]
      parameters:
        - name: text
          in: query
          description: Text to synthesize
          required: false
          schema: { type: string }
        - name: voice
          in: query
          description: Edge voice name
          required: false
          schema: { type: string }
        - name: rate
          in: query
          description: Prosody rate
          required: false
          schema: { type: string }
        - name: pitch
          in: query
          description: Prosody pitch
          required: false
          schema: { type: string }
        - name: volume
          in: query
          description: Prosody volume
          required: false
          schema: { type: string }
        - name: format
          in: query
          description: Output format for backchannel (currently wav only)
          required: false
          schema: { type: string, enum: [ wav ] }
        - name: target_type
          in: query
          description: Push target type
          required: false
          schema: { type: string, enum: [ ipwebcam, wss, backchannel, stream ] }
        - name: target
          in: query
          description: Generic target alias for url/dst
          required: false
          schema: { type: string }
        - name: dst
          in: query
          description: Destination stream name for backchannel
          required: false
          schema: { type: string }
        - name: url
          in: query
          description: WebSocket URL for ipwebcam target
          required: false
          schema: { type: string }
        - name: proxy
          in: query
          description: Optional HTTP proxy URL
          required: false
          schema: { type: string }
        - name: connect_timeout
          in: query
          description: Connection timeout in seconds
          required: false
          schema: { type: integer, minimum: 1 }
        - name: receive_timeout
          in: query
          description: Receive timeout in seconds
          required: false
          schema: { type: integer, minimum: 1 }
        - name: sample_rate
          in: query
          description: PCM sample rate for ipwebcam payload
          required: false
          schema: { type: integer, minimum: 1 }
        - name: chunk_ms
          in: query
          description: Chunk duration in milliseconds for ipwebcam push
          required: false
          schema: { type: integer, minimum: 1 }
        - name: realtime
          in: query
          description: Send in realtime pace for ipwebcam
          required: false
          schema: { type: boolean }
        - name: insecure_tls
          in: query
          description: Skip TLS verification for wss target
          required: false
          schema: { type: boolean }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                voice: { type: string }
                rate: { type: string }
                pitch: { type: string }
                volume: { type: string }
                format: { type: string, enum: [ wav ] }
                target_type: { type: string, enum: [ ipwebcam, wss, backchannel, stream ] }
                target: { type: string }
                dst: { type: string }
                url: { type: string }
                proxy: { type: string }
                connect_timeout: { type: integer }
                receive_timeout: { type: integer }
                sample_rate: { type: integer }
                chunk_ms: { type: integer }
                realtime: { type: boolean }
                insecure_tls: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              example: { engine: "edge-tts-go", target_type: "ipwebcam", target: "wss://192.168.1.10:8080/audioin.wav", format: "pcm16le", bytes: 182044 }
        "400":
          description: Invalid request
        "405":
          description: Method not allowed
        "502":
          description: Failed to synthesize or push
        "503":
          description: Target queue full or target unavailable
        "504":
          description: Request timed out or canceled


