streams:
  # Example stream
  # camera1:
  #   - rtsp://username:passwd@192.168.1.13:8080/h264_ulaw.sdp
  # camera2:
  #   - rtsp://username:passwd0@192.168.1.176:8080/h264_ulaw.sdp
  test:
    - rtsp://192.168.123.42:8080/h264_ulaw.sdp
api:
  listen: ":1984"
  username: "username"
  password: "password"

# It is recommended to configure the record settings in the WebUI.
record:
  rules:
    - src: test
      prebuffer: 10
  dir: ./records
  retention: 7
