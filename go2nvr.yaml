streams:
  # Example stream
  # camera1:
  #   - rtsp://username:passwd@192.168.1.13:8080/h264_ulaw.sdp
  test2:
    - rtsp://172.30.195.106:8080/h264_ulaw.sdp
api:
  listen: ":1984"
  username: "username"
  password: "password"


# It is recommended to configure the record settings in the WebUI.
record:
  dir: ./records
  retention: 3
  rules:
    - src: test2
      prebuffer: 10
      trigger_id: 1
      trigger_threshold: 14
      trigger_post: 10
      trigger_interval: 500
