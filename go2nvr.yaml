streams:
  # Example stream
  # camera1:
  #   - rtsp://username:passwd@192.168.1.13:8080/h264_ulaw.sdp
  test1:
    - rtsp://192.168.123.42:8080/h264_ulaw.sdp
api:
  listen: ":1984"
  username: "username"
  password: "password"
# log:
#   level: debug



# It is recommended to configure the record settings in the WebUI.
record:
  dir: ./records
  retention: 3
  rules:
    - src: test2
      prebuffer: 10
      trigger_id: 1
      trigger_interval: 500
      trigger_params:
        min_hits: 1
        post_sec: 10
        threshold: 14
    - src: test1
      prebuffer: 10
      trigger_id: 1
      trigger_interval: 250
      trigger_params:
        min_hits: 1
        post_sec: 10
        threshold: 14
