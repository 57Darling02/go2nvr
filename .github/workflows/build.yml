name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - 'product/go2nvr'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: 0 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Resolve Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --dirty --always 2>/dev/null || git rev-parse --short HEAD)"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "GO_LDFLAGS=-s -w -X github.com/AlexxIT/go2rtc/internal/app.VersionOverride=${version#v}" >> "$GITHUB_ENV"

      - name: Build Web UI
        shell: bash
        run: ./scripts/build-webui.sh

      - name: Build go2nvr_win64
        env: { GOOS: windows, GOARCH: amd64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_win64.exe
      - name: Upload go2nvr_win64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_win64, path: go2nvr_win64.exe }

      - name: Build go2nvr_win32
        env: { GOOS: windows, GOARCH: 386 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_win32.exe
      - name: Upload go2nvr_win32
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_win32, path: go2nvr_win32.exe }

      - name: Build go2nvr_win_arm64
        env: { GOOS: windows, GOARCH: arm64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_win_arm64.exe
      - name: Upload go2nvr_win_arm64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_win_arm64, path: go2nvr_win_arm64.exe }

      - name: Build go2nvr_linux_amd64
        env: { GOOS: linux, GOARCH: amd64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_amd64
      - name: Upload go2nvr_linux_amd64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_amd64, path: go2nvr_linux_amd64 }

      - name: Build go2nvr_linux_i386
        env: { GOOS: linux, GOARCH: 386 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_i386
      - name: Upload go2nvr_linux_i386
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_i386, path: go2nvr_linux_i386 }

      - name: Build go2nvr_linux_arm64
        env: { GOOS: linux, GOARCH: arm64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_arm64
      - name: Upload go2nvr_linux_arm64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_arm64, path: go2nvr_linux_arm64 }

      - name: Build go2nvr_android_arm64
        env: { GOOS: android, GOARCH: arm64 }
        run: go build -ldflags "$GO_LDFLAGS  -checklinkname=0" -trimpath -o go2nvr_android_arm64
      - name: Upload go2nvr_android_arm64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_android_arm64, path: go2nvr_android_arm64 }

      - name: Build go2nvr_linux_arm
        env: { GOOS: linux, GOARCH: arm, GOARM: 7 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_arm
      - name: Upload go2nvr_linux_arm
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_arm, path: go2nvr_linux_arm }

      - name: Build go2nvr_linux_armv6
        env: { GOOS: linux, GOARCH: arm, GOARM: 6 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_armv6
      - name: Upload go2nvr_linux_armv6
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_armv6, path: go2nvr_linux_armv6 }

      - name: Build go2nvr_linux_mipsel
        env: { GOOS: linux, GOARCH: mipsle }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_linux_mipsel
      - name: Upload go2nvr_linux_mipsel
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_linux_mipsel, path: go2nvr_linux_mipsel }

      - name: Build go2nvr_mac_amd64
        env: { GOOS: darwin, GOARCH: amd64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_mac_amd64
      - name: Upload go2nvr_mac_amd64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_mac_amd64, path: go2nvr_mac_amd64 }

      - name: Build go2nvr_mac_arm64
        env: { GOOS: darwin, GOARCH: arm64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_mac_arm64
      - name: Upload go2nvr_mac_arm64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_mac_arm64, path: go2nvr_mac_arm64 }

      - name: Build go2rtc_freebsd_amd64
        env: { GOOS: freebsd, GOARCH: amd64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_freebsd_amd64
      - name: Upload go2rtc_freebsd_amd64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_freebsd_amd64, path: go2nvr_freebsd_amd64 }

      - name: Build go2rtc_freebsd_arm64
        env: { GOOS: freebsd, GOARCH: arm64 }
        run: go build -ldflags "$GO_LDFLAGS" -trimpath -o go2nvr_freebsd_arm64
      - name: Upload go2rtc_freebsd_arm64
        uses: actions/upload-artifact@v4
        with: { name: go2nvr_freebsd_arm64, path: go2nvr_freebsd_arm64 }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            go2nvr*


