name: Test

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Test Go packages
        run: go test ./...

      - name: Race test recorder and streams
        run: go test -race ./internal/record/... ./internal/streams/...

      - name: Build from source
        run: ./scripts/build-go2nvr.sh -trimpath -o ./go2nvr

      - name: Smoke test static files under api.base_path
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/go2nvr.yaml"
          log="$RUNNER_TEMP/go2nvr.log"
          cat > "$config" <<'EOF'
          api:
            listen: "127.0.0.1:1985"
            base_path: "/nvr"
          EOF

          ./go2nvr -config "$config" > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:1985/nvr/ > "$RUNNER_TEMP/index.html"; then
              break
            fi
            sleep 0.5
          done
          test -s "$RUNNER_TEMP/index.html" || { cat "$log"; exit 1; }

          asset=$(grep -m 1 -oE '(src|href)="\./assets/[^"]+"' "$RUNNER_TEMP/index.html" | cut -d '"' -f 2)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:1985/nvr/${asset#./}" > /dev/null

          curl --fail --silent --show-error http://127.0.0.1:1985/nvr/favicon.ico > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:1985/nvr/api > /dev/null

  docker:
    name: Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            file: docker/Dockerfile
          - name: hardware
            file: docker/hardware.Dockerfile
          - name: rockchip
            file: docker/rockchip.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: DOCKER_BUILDKIT=1 docker build --file "${{ matrix.file }}" --tag "go2nvr:test-${{ matrix.name }}" .
